# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: secdevlabs-games-irados
services:
  mysqldb-a10:
    build:
      context: ../../build/mysqldb-a10
    image: isoloom/secdevlabs-games-irados-mysqldb-a10
    platform: linux/amd64
    hostname: mysqldb-a10
    networks:
      lab:
        ipv4_address: 10.60.109.20
    volumes:
    - mysqldb-a10-data:/var/lib/mysql
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3306
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.mariadb: tcp:3306
    restart: unless-stopped
  mysqldb-a10-routes:
    image: alpine:3.20
    network_mode: service:mysqldb-a10
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      mysqldb-a10:
        condition: service_started
    restart: unless-stopped
  app:
    build:
      context: ../../build/app
    image: isoloom/secdevlabs-games-irados-app
    platform: linux/amd64
    hostname: app
    networks:
      lab:
        ipv4_address: 10.60.109.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+10010}:10010
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 10010
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      mysqldb-a10:
        condition: service_healthy
      mysqldb-a10-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:10010
    restart: unless-stopped
  app-routes:
    image: alpine:3.20
    network_mode: service:app
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      mysqldb-a10:
        condition: service_healthy
      mysqldb-a10-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
  isoloom-check-mysqldb-a10:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/mysqldb-a10.sh:/isoloom/run.sh:ro
    network_mode: service:mysqldb-a10
    depends_on:
      mysqldb-a10:
        condition: service_healthy
      mysqldb-a10-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
  isoloom-check-app:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/app.sh:/isoloom/run.sh:ro
    network_mode: service:app
    depends_on:
      mysqldb-a10:
        condition: service_healthy
      mysqldb-a10-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.109.0/24
        gateway: 10.60.109.1
volumes:
  mysqldb-a10-data: {}
  isoloom-probe-amd64: {}
